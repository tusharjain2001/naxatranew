<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/favicon-512.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Naxatra Labs designs and manufactures advanced electric motors and controllers in India for OEMs and mobility companies worldwide."
    />
    <title>Naxatra Labs | Advanced Motors &amp; Controllers Made in India</title>
    <script>
      // Start fetching the page's hero photo before the app script has even loaded, so the hero is not a
      // blank block while the script downloads. [desktop photo, phone photo] for each page.
      (function () {
        var heroes = {
          '': ['/assets/hero-motion.webp', '/assets/m/hero-motion.webp'],
          '/industry/2-wheeler': ['/assets/industry/2w/hero-desktop.webp', '/assets/industry/2w/hero.png'],
          '/industry/3-wheeler': ['/assets/industry/3w/hero-desktop.webp', '/assets/industry/3w/m-hero.jpg'],
          '/industry/cleaning': ['/assets/industry/cleaning/hero-desktop.webp', '/assets/industry/cleaning/hero.png'],
          '/industry/agriculture': ['/assets/industry/agri/hero-desktop.webp', '/assets/industry/agri/m/hero.jpg'],
          '/industry/others': ['/assets/others/hero.webp', '/assets/others/m/hero.webp'],
          '/about': ['/assets/about/hero.webp', '/assets/about/m-hero.webp'],
          '/careers': ['/assets/careers/hero.webp', '/assets/careers/m/hero.webp'],
          '/contact': ['/assets/contact/hero.webp', '/assets/contact/m/hero.jpg'],
        };
        var hero = heroes[location.pathname.replace(/\/+$/, '')];
        if (!hero) return;
        [[hero[0], '(min-width: 1280px)'], [hero[1], '(max-width: 1279px)']].forEach(function (p) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.href = p[0];
          l.media = p[1];
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        });
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400&family=Inter:wght@400&display=swap"
      rel="stylesheet"
    />
    <script>
      // Scale the whole layout from the Figma artboards: 1920px wide on desktop, 402px on mobile.
      // 1 design px = 1/16 rem, so sizing the root font keeps every section proportional.
      (function () {
        var root = document.documentElement;
        function fit() {
          var w = root.clientWidth;
          var size = window.innerWidth >= 1280 ? Math.min(w / 120, 16) : Math.min(w / 25.125, 18);
          root.style.fontSize = size + 'px';
        }
        fit();
        window.addEventListener('resize', fit);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
